apiVersion: v2
name: lgtm
description: A Helm chart for Kubernetes
type: application
version: 0.1.0

dependencies:
  - alias: grafana
    condition: grafana.enabled
    name: grafana
    repository: https://grafana.github.io/helm-charts
    version: 10.3.0
  - name: minio
    version: 0.1.0
    repository: file://minio
    condition: minio.enabled
  - name: mimir
    version: 0.1.0
    repository: file://mimir
    condition: mimir.enabled
  - name: tempo
    version: 0.1.0
    repository: file://tempo
    condition: tempo.enabled
  - name: loki
    version: 0.1.0
    repository: file://loki
    condition: loki.enabled
