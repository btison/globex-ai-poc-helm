replicas: 1

image:
  registry: docker.io
  repository: grafana/mimir
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "r354-d48a2220"

podManagementPolicy: Parallel

statefulStrategy:
  type: RollingUpdate

serviceAccount:
  create: true
  name:
  annotations: {}
  labels: {}

persistentVolume:
  enabled: true
  name: storage
  size: "8Gi"
  accessModes:
    - ReadWriteOnce

podSecurityContext:
  fsGroup: null
  runAsGroup: null
  runAsNonRoot: true
  runAsUser: null
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

terminationGracePeriodSeconds: 900

compression:
  enabled: true
  algorithm: snappy

grpcMaxQueryResponseSizeBytes: "209715200"

livenessProbe: null
readinessProbe:
  httpGet:
    path: /ready
    port: http-metrics
  initialDelaySeconds: 60
resources:
  requests:
    cpu: 100m
    memory: 512Mi

mimir:
  config: |

    multitenancy_enabled: false

    usage_stats:
      installation_mode: helm

    activity_tracker:
      filepath: /active-query-tracker/activity.log

    alertmanager:
      data_dir: /data/alertmanager
      enable_api: true
      external_url: /alertmanager

    {{- if .Values.minio.enabled }}
    alertmanager_storage:
      backend: s3
      s3:
        access_key_id: {{ .Values.minio.rootUser }}
        bucket_name: {{ include "mimir.minioBucketPrefix" . }}-ruler
        endpoint: {{ .Values.minio.name }}.{{ .Release.Namespace }}.svc:{{ .Values.minio.service.port }}
        insecure: true
        secret_access_key: {{ .Values.minio.rootPassword }}
    {{- end }}

    # This configures how the store-gateway synchronizes blocks stored in the bucket. It uses Minio by default for getting started (configured via flags) but this should be changed for production deployments.
    blocks_storage:
      backend: s3
      bucket_store:
        sync_dir: /data/tsdb-sync
      {{- if .Values.minio.enabled }}
      s3:
        access_key_id: {{ .Values.minio.rootUser }}
        bucket_name: {{ include "mimir.minioBucketPrefix" . }}-tsdb
        endpoint: {{ .Values.minio.name }}.{{ .Release.Namespace }}.svc:{{ .Values.minio.service.port }}
        insecure: true
        secret_access_key: {{ .Values.minio.rootPassword }}
      {{- end }}
      tsdb:
        dir: /data/tsdb
        head_compaction_interval: 15m
        wal_replay_concurrency: 3

    compactor:
      compaction_interval: 30m
      deletion_delay: 2h
      max_closing_blocks_concurrency: 2
      max_opening_blocks_concurrency: 4
      symbols_flushers_concurrency: 4
      first_level_compaction_wait_period: 25m
      data_dir: "/data/compactor"
      sharding_ring:
        wait_stability_min_duration: 1m
        heartbeat_period: 1m
        heartbeat_timeout: 4m

    distributor:
      # Increase the default remote write timeout (applied to writing to Kafka too) because writing
      # to Kafka-compatible backend may be slower than writing directly to ingesters.
      remote_timeout: 5s
      ring:
        heartbeat_period: 1m
        heartbeat_timeout: 4m

    frontend:
      parallelize_shardable_queries: true

    frontend_worker:
      grpc_client_config:
        max_send_msg_size: 419430400 # 400MiB
      # TODO DIETER: or frontend_address: {{ template "mimir.fullname" . }}-query-frontend-headless.{{ .Release.Namespace }}.svc:{{ include "mimir.serverGrpcListenPort" . }} ?
      frontend_address: {{ include "mimir.name" . }}-headless.{{ .Release.Namespace }}.svc:{{ include "mimir.serverGrpcListenPort" . }}
    ingest_storage:
      enabled: true
      kafka:
        {{- if .Values.kafka.enabled }}
        # Address of Kafka broker to bootstrap the connection.
        address: {{ template "mimir.fullname" . }}-kafka.{{ .Release.Namespace }}.svc.{{ $.Values.global.clusterDomain }}:{{ $.Values.kafka.service.port }}
        {{- end }}
        # Topic name.
        topic: mimir-ingest
        # Mimir will auto-create the topic on start up.
        # The topic MUST be provisioned with no fewer partitions than the maximum number of ingester replicas. The value of 100 is for demo purposes.
        auto_create_topic_enabled: true
        auto_create_topic_default_partitions: 100

    ingester:
      # Disallow Push gRPC API; everything comes through Kafka in the ingest storage architecture.
      push_grpc_method_enabled: false
      ring:
        final_sleep: 0s
        num_tokens: 512
        tokens_file_path: /data/ingester/tokens
        unregister_on_shutdown: false
        heartbeat_period: 2m
        heartbeat_timeout: 10m

    ingester_client:
      grpc_client_config:
        max_recv_msg_size: 104857600
        max_send_msg_size: 104857600

    limits:
      # Limit queries to 500 days. You can override this on a per-tenant basis.
      max_total_query_length: 12000h
      # Adjust max query parallelism to 16x sharding, without sharding we can run 15d queries fully in parallel.
      # With sharding we can further shard each day another 16 times. 15 days * 16 shards = 240 subqueries.
      max_query_parallelism: 240
      # Avoid caching results newer than 10m because some samples can be delayed
      # This presents caching incomplete results
      max_cache_freshness: 10m

    memberlist:
      abort_if_cluster_join_fails: false
      compression_enabled: false
      join_members:
      - dns+{{ include "mimir.name" . }}-gossip-ring.{{ .Release.Namespace }}.svc.{{ .Values.global.clusterDomain }}:{{ include "mimir.memberlistBindPort" . }}

    querier:
      # With query sharding we run more but smaller queries. We must strike a balance
      # which allows us to process more sharded queries in parallel when requested, but not overload
      # queriers during non-sharded queries.
      max_concurrent: 16

    query_scheduler:
      # Increase from default of 100 to account for queries created by query sharding
      max_outstanding_requests_per_tenant: 800

    ruler:
      alertmanager_url: dnssrvnoa+http://_http-metrics._tcp.{{ template "mimir.name" . }}-headless.{{ .Release.Namespace }}.svc.{{ .Values.global.clusterDomain }}/alertmanager     
      enable_api: true
      rule_path: "/data/ruler"

    ruler_storage:
      {{- if .Values.minio.enabled }}
      backend: s3
      s3:
        endpoint: {{ .Values.minio.name }}.{{ .Release.Namespace }}.svc:{{ .Values.minio.service.port }}
        bucket_name: {{ include "mimir.minioBucketPrefix" . }}-ruler
        access_key_id: {{ .Values.minio.rootUser }}
        secret_access_key: {{ .Values.minio.rootPassword }}
        insecure: true
    {{- end }}

    runtime_config:
      file: /var/{{ include "mimir.name" . }}/runtime.yaml

    store_gateway:
      sharding_ring:
        heartbeat_period: 1m
        heartbeat_timeout: 10m
        wait_stability_min_duration: 1m
        tokens_file_path: /data/tokens
        unregister_on_shutdown: false


  structuredConfig:
    ingest_storage:
      enabled: false
      kafka:
        address: null
        topic: null
        auto_create_topic_default_partitions: null
    distributor:
      remote_timeout: null
    ingester:
      push_grpc_method_enabled: true

runtimeConfig: {}

service:
  annotations: {}
  labels: {}
  # -- https://kubernetes.io/docs/concepts/services-networking/service-traffic-policy/
  internalTrafficPolicy: Cluster
  type: ClusterIP
  extraPorts: []
  # -- https://kubernetes.io/docs/concepts/services-networking/service/#traffic-distribution
  trafficDistribution: ""

kafka:
  enabled: false

minio:
  enabled: true
  name: minio
  rootUser: ""
  service:
    port: 9000
  rootPassword: ""

global:
  clusterDomain: cluster.local.
