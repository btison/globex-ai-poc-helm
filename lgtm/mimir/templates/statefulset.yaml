{{- $args := dict "ctx" . "component" "mimir" "memberlist" true -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mimir.name" . }}
  labels:
    {{- include "mimir.labels" $args | nindent 4 }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  podManagementPolicy: {{ .Values.podManagementPolicy }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "mimir.selectorLabels" $args | nindent 6 }}
  updateStrategy:
    {{- toYaml .Values.statefulStrategy | nindent 4 }}
  serviceName: {{ template "mimir.name" . }}-headless
  {{- if .Values.persistentVolume.enabled }}
  {{- with .Values.persistentVolume }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: {{ .name }}
        {{- if .annotations }}
        annotations:
          {{- toYaml .annotations | nindent 10 }}
        {{- end }}
      spec:
        {{- if .storageClass }}
        {{- if (eq "-" .storageClass) }}
        storageClassName: ""
        {{- else }}
        storageClassName: {{ .storageClass }}
        {{- end }}
        {{- end }}
        accessModes:
          {{- toYaml .accessModes | nindent 10 }}
        resources:
          requests:
            storage: "{{ .size }}"
  {{- end }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "mimir.podLabels" $args | nindent 8 }}
    spec:
      serviceAccountName: {{ template "mimir.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      volumes:
        - name: config
          configMap:
            name: {{ include "mimir.name" . }}-config
            items:
              - key: "mimir.yaml"
                path: "mimir.yaml"
        - name: runtime-config
          configMap:
            name: {{ template "mimir.name" . }}-runtime
        {{- if not .Values.persistentVolume.enabled }}
        - name: storage
          emptyDir: {}
        {{- end }}
        - name: active-queries
          emptyDir: {}
      containers:
        - name: monolithic
          image: {{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-target=all"
            - "-config.expand-env=true"
            - "-config.file=/etc/mimir/mimir.yaml"
            - "-ingester.ring.instance-availability-zone=zone-default"
            - "-server.grpc-max-concurrent-streams=500"
            - "-server.grpc.keepalive.max-connection-age=60s"
            - "-server.grpc.keepalive.max-connection-age-grace=5m"
            - "-server.grpc.keepalive.max-connection-idle=1m"
            {{- if .Values.compression.enabled }}
            - "-query-frontend.grpc-client-config.grpc-compression={{ .Values.compression.algorithm }}"
            - "-query-scheduler.grpc-client-config.grpc-compression={{ .Values.compression.algorithm }}"
            - "-ruler.client.grpc-compression={{ .Values.compression.algorithm }}"
            - "-ruler.query-frontend.grpc-client-config.grpc-compression={{ .Values.compression.algorithm }}"
            - "-ingester.client.grpc-compression={{ .Values.compression.algorithm }}"
            {{- end }}
            - "-memberlist.abort-if-fast-join-fails=true"
            - "-querier.store-gateway-client.grpc-max-recv-msg-size={{ .Values.grpcMaxQueryResponseSizeBytes }}"
            - "-server.grpc-max-send-msg-size-bytes={{ .Values.grpcMaxQueryResponseSizeBytes }}"
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
            - name: runtime-config
              mountPath: /var/{{ include "mimir.name" . }}
            - name: storage
              mountPath: "/data"
            - name: active-queries
              mountPath: /active-query-tracker
          ports:
            - name: http-metrics
              containerPort: {{ include "mimir.serverHttpListenPort" . }}
              protocol: TCP
            - name: grpc
              containerPort: {{ include "mimir.serverGrpcListenPort" . }}
              protocol: TCP
            - name: memberlist
              containerPort: {{ include "mimir.memberlistBindPort" . }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          env:
            - name: GOMAXPROCS
              value: "4"
